# job-agent configuration. Edit freely; no code changes needed.

spreadsheet_id: 1uPvcgjgTKvmiKs6I-MeLvjCf7fENFEQ-bljOnNKaW9c
tracker_tab: Tracker
inbox_tab: Job Inbox
log_tab: Pipeline Log
boards_tab: Boards
timezone: Asia/Kolkata

search:
  hours_old: 30              # last ~day (runs daily; 6 h overlap so nothing slips between runs)
  results_per_query: 30      # per site, per query, per location pass
  # google = Google Jobs, which indexes company career pages (Workday,
  # SmartRecruiters, SuccessFactors...) and surfaces new employers.
  # Glassdoor dropped: it blocks scrapers most days and slowed every run.
  # Google Jobs dropped: it returned nothing from GitHub's servers.
  sites: [indeed, linkedin, naukri]
  country_indeed: India
  # Two passes per query: Hyderabad (home market, searched on its own so
  # local jobs are never crowded out) and India-wide (catches Bengaluru,
  # Pune, Mumbai, Gurugram and remote; other cities are filtered out below).
  locations: [Hyderabad, India]
  include_remote: false      # the India-wide pass already returns remote roles
  # Every title runs every day.
  queries_daily:
    # procurement
    - procurement analyst
    - senior procurement analyst
    - procurement business analyst
    - spend analytics
    - procure to pay analyst
    - vendor management analyst
    # business analyst
    - senior business analyst
    - lead business analyst
    - business systems analyst
    # data / BI
    - senior data analyst
    - senior BI analyst power bi
    - senior reporting analyst
  # Extra international search on one weekday (visa-sponsoring markets).
  international:
    weekday: 6
    queries: [procurement analyst, senior business analyst]
    sites: [indeed, linkedin, bayt]    # Bayt = main Gulf job board
    markets:
      - {location: Dubai, country_indeed: United Arab Emirates}
      - {location: Abu Dhabi, country_indeed: United Arab Emirates}
      - {location: Singapore, country_indeed: Singapore}

# Speed limits so no site blocks the run. If a site still blocks twice in a
# row, the rest of that site's searches are skipped for the day (no ban),
# and the other sites carry on.
rate_limits:
  pause_seconds: 4             # between searches on Indeed / Naukri
  linkedin_pause_seconds: 10   # LinkedIn blocks fast callers
  linkedin_results: 20         # per LinkedIn search
  stop_site_after_blocks: 2
  workday_boards_per_run: 15   # rotates through all Workday boards over a few days
  workday_pause_seconds: 4
  workday_stop_after_429: 3    # Workday said "too many requests" 3x -> stop Workday for today
  linkcheck_pause_seconds: 1.5

ats:
  # The "Boards" tab grows by itself: every company board found in your
  # tracker links or in LinkedIn/Indeed/Naukri/Glassdoor/Google results is
  # added and then searched directly. These are extra starting boards
  # (verified to exist from real procurement postings, Nov 2026).
  greenhouse: [mixpanel, sigmoid, appfire]
  lever: [keyloop]
  ashby: []
  smartrecruiters: []
  workable: [proarch]
  workday: []           # full careers URL, e.g. https://3m.wd1.myworkdayjobs.com/en-US/Search
  workday_search_terms: [procurement, business analyst, data analyst]
  max_boards_per_run: 40   # non-Workday boards per run, oldest-searched first

filters:
  # A title must contain at least one of these (case-insensitive).
  title_must_match_any:
    - procurement
    - sourcing
    - spend
    - purchasing
    - procure
    - p2p
    - s2p
    - vendor
    - supplier
    - contract
    - buyer
    - software asset
    - category
    # business / data / BI analyst roles
    - business analyst
    - data analyst
    - bi analyst
    - business intelligence
    - power bi
    - reporting analyst
    - mis analyst
    - systems analyst
    - analytics
    - insights analyst
  title_exclude:
    - intern
    - trainee
    - fresher
    - junior
    - jr.
    - jr
    - entry level
    - graduate
    - data engineer
    - data scientist
    - machine learning
    - software engineer
    - software developer
    - java
    - .net
    - full stack
    - frontend
    - backend
    - sales executive
    - sales manager
    - inside sales
    - sales representative
    - business development
    - vice president
    - chief
    - director
    - head of
    - legal counsel
    - attorney
  # Location must mention one of these (empty location is allowed).
  location_must_match_any:
    - india
    - hyderabad
    - bengaluru
    - bangalore
    - pune
    - mumbai
    - gurugram
    - gurgaon
    - noida
    - chennai
    - remote
    - dubai
    - abu dhabi
    - singapore
    - united arab emirates
  # Agencies are NOT blocked. Their postings are kept and tagged
  # "agency" so Claude can note it.
  agency_hints:
    - staffing
    - recruitment
    - recruiters
    - placement
    - manpower
    - hiring solutions
    - hr solutions
    - randstad
    - artech
    - teksystems
    - adecco
    - hays
    - michael page
    - robert half
    - quess
    - teamlease
    - xpheno
    - jobgether
    - weekday
  blocked_companies: []        # nothing blocked
  description_agency_hints:
    - listed on behalf of a partner company
    - this role is for one of
    - on behalf of our client
    - our client is looking
    - for one of our clients

scoring:
  # Prefilter only. Claude does the real scoring against your resume.
  min_prefilter_score: 40
  max_inbox_rows_per_run: 50

linkcheck:
  max_rows_per_run: 150
  recheck_after_days: 3
  skip_statuses: [Rejected, Offer, Dropped]
