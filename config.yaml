# job-agent configuration. Edit freely; no code changes needed.

spreadsheet_id: 1uPvcgjgTKvmiKs6I-MeLvjCf7fENFEQ-bljOnNKaW9c
tracker_tab: Tracker
inbox_tab: Job Inbox
log_tab: Pipeline Log
boards_tab: Boards
timezone: Asia/Kolkata

search:
  hours_old: 48              # only postings from the last 2 days
  results_per_query: 20      # per site, per query/location
  # google = Google Jobs, which indexes company career pages (Workday,
  # SmartRecruiters, SuccessFactors...) and surfaces new employers.
  # Glassdoor dropped: it blocks scrapers most days and slowed every run.
  sites: [indeed, linkedin, naukri, google]
  country_indeed: India
  locations: [Hyderabad, Bengaluru, Pune, Mumbai, Gurugram]
  include_remote: true       # extra "remote" search with location India
  pause_seconds: 3           # politeness delay between searches
  # Monday = 0 ... Sunday = 6. Every day covers all three role families:
  # procurement, senior business analyst, senior data / BI analyst.
  queries_by_weekday:
    0: [procurement analyst, senior business analyst, senior data analyst power bi]
    1: [procurement business analyst, business analyst power bi, senior BI analyst]
    2: [spend analytics, senior business analyst procurement, data analyst procurement]
    3: [senior procurement analyst, senior business analyst ERP, senior reporting analyst]
    4: [procure to pay analyst, business analyst salesforce, power bi developer analyst]
    5: [vendor management analyst, lead business analyst, senior data analyst]
    6: [procurement operations analyst, senior business systems analyst, business intelligence analyst]
  # Extra international search on one weekday (visa-sponsoring markets).
  international:
    weekday: 6
    queries: [procurement analyst, senior business analyst]
    sites: [indeed, linkedin, bayt]    # Bayt = main Gulf job board
    markets:
      - {location: Dubai, country_indeed: United Arab Emirates}
      - {location: Abu Dhabi, country_indeed: United Arab Emirates}
      - {location: Singapore, country_indeed: Singapore}

ats:
  # The "Boards" tab grows by itself: every company board found in your
  # tracker links or in LinkedIn/Indeed/Naukri/Glassdoor/Google results is
  # added and then searched directly. These are extra starting boards
  # (verified to exist from real procurement postings, Nov 2026).
  greenhouse: [vultr, mixpanel, sigmoid, appfire, neysanetwork]
  lever: [keyloop, GoToGroup]
  ashby: []
  smartrecruiters: []
  workable: [proarch]
  workday: []           # full careers URL, e.g. https://3m.wd1.myworkdayjobs.com/en-US/Search
  workday_search_terms: [procurement, business analyst, data analyst, power bi]
  max_boards_per_run: 50   # oldest-searched first; the rest rotate in next day

filters:
  # A title must contain at least one of these (case-insensitive).
  title_must_match_any:
    - procurement
    - sourcing
    - spend
    - purchasing
    - procure
    - p2p
    - s2p
    - vendor
    - supplier
    - contract
    - buyer
    - software asset
    - category
    # business / data / BI analyst roles
    - business analyst
    - data analyst
    - bi analyst
    - business intelligence
    - power bi
    - reporting analyst
    - mis analyst
    - systems analyst
    - analytics
    - insights analyst
  title_exclude:
    - intern
    - trainee
    - fresher
    - junior
    - jr.
    - jr
    - entry level
    - graduate
    - data engineer
    - data scientist
    - machine learning
    - software engineer
    - software developer
    - java
    - .net
    - full stack
    - frontend
    - backend
    - sales executive
    - sales manager
    - inside sales
    - sales representative
    - business development
    - vice president
    - chief
    - director
    - head of
    - legal counsel
    - attorney
  # Location must mention one of these (empty location is allowed).
  location_must_match_any:
    - india
    - hyderabad
    - bengaluru
    - bangalore
    - pune
    - mumbai
    - gurugram
    - gurgaon
    - noida
    - chennai
    - remote
    - dubai
    - abu dhabi
    - singapore
    - united arab emirates
  agency_hints:
    - staffing
    - recruitment
    - recruiters
    - placement
    - manpower
    - hiring solutions
    - hr solutions
  # Posts jobs for unnamed clients (can't research, can't contact).
  blocked_companies: [indeed, jobgether, weekday ai, weekday-1, weekday]
  description_agency_hints:
    - listed on behalf of a partner company
    - this role is for one of
    - on behalf of our client
    - our client is looking
    - for one of our clients

scoring:
  # Prefilter only. Claude does the real scoring against your resume.
  min_prefilter_score: 40
  max_inbox_rows_per_run: 50

linkcheck:
  max_rows_per_run: 150
  recheck_after_days: 3
  skip_statuses: [Rejected, Offer, Dropped]
